<svg xmlns="http://www.w3.org/2000/svg" width="412" height="132" viewBox="0 0 412 132" role="img" aria-labelledby="t d"><title id="t">Prediction markets</title><desc id="d">Opinions are cheap. Odds have a price.</desc>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.ch{stroke-dasharray:1;stroke-dashoffset:0}
@keyframes ch{0%{stroke-dashoffset:1}35%,100%{stroke-dashoffset:0}}
@keyframes dot{0%,33%{opacity:0}37%,100%{opacity:1}}
@keyframes rg{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@keyframes yes{0%,100%{transform:scaleX(.64)}30%{transform:scaleX(.55)}65%{transform:scaleX(.73)}}
@media (prefers-reduced-motion:no-preference){
.ch{animation:ch 7s ease-in-out infinite}.dt{animation:dot 7s ease-in-out infinite}
.rg{transform-box:fill-box;transform-origin:center;animation:rg 1.9s ease-out infinite}
.yes{animation:yes 7s ease-in-out infinite}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f8fc"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<radialGradient id="ac" cx="0.08" cy="0.1" r="0.9"><stop offset="0" stop-color="#0891b2" stop-opacity="0.1"/><stop offset="0.6" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect x="0.5" y="0.5" width="411" height="131" rx="16"/></clipPath>
<clipPath id="bar"><rect x="24" y="86" width="84" height="9" rx="4.5"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="412" height="132" fill="url(#bg)"/><rect width="412" height="132" fill="url(#ac)"/></g>
<rect x="0.5" y="0.5" width="411" height="131" rx="16" fill="none" stroke="#d3dbea"/>
<rect x="12" y="12" width="108" height="108" rx="13" fill="#0891b2" fill-opacity="0.06" stroke="#0891b2" stroke-opacity="0.32"/>
<path d="M24 76H108M24 58H108M24 40H108" stroke="#0891b2" stroke-opacity="0.16" stroke-dasharray="2 4"/>
<path class="ch" d="M26 72L35 64L43 68L52 53L61 59L70 44L79 50L88 36L100 33" pathLength="1" fill="none" stroke="#0891b2" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<g class="dt"><circle class="rg" cx="100" cy="33" r="3.4" fill="#0891b2"/><circle cx="100" cy="33" r="3.4" fill="#0891b2"/></g>
<g clip-path="url(#bar)"><rect x="24" y="86" width="84" height="9" fill="#e11d48"/><rect class="yes" x="24" y="86" width="84" height="9" fill="#059669" style="transform-box:fill-box;transform-origin:left center;transform:scaleX(.64)"/></g>
<text class="m" x="24" y="108" font-size="8.5" font-weight="700" fill="#059669">YES</text>
<text class="m" x="108" y="108" font-size="8.5" font-weight="700" text-anchor="end" fill="#e11d48">NO</text>
<text class="s" x="136" y="40" font-size="17" font-weight="700" fill="#101828">Prediction markets</text>
<text class="s" x="136" y="63" font-size="12.5" fill="#475467">Opinions are cheap. Odds have a price.</text>
<rect x="136" y="84" width="43.2" height="22" rx="11" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.4"/><text class="m" x="145" y="98.6" font-size="10.5" font-weight="600" fill="#0891b2" textLength="25.2" lengthAdjust="spacing">odds</text><rect x="185.2" y="84" width="87.3" height="22" rx="11" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.4"/><text class="m" x="194.2" y="98.6" font-size="10.5" font-weight="600" fill="#0891b2" textLength="69.3" lengthAdjust="spacing">order books</text><rect x="278.5" y="84" width="62.1" height="22" rx="11" fill="#0891b2" fill-opacity="0.08" stroke="#0891b2" stroke-opacity="0.4"/><text class="m" x="287.5" y="98.6" font-size="10.5" font-weight="600" fill="#0891b2" textLength="44.1" lengthAdjust="spacing">signals</text>
