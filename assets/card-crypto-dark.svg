<rect x="12" y="12" width="108" height="108" rx="13" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-opacity="0.28"/>
<g class="coin"><circle cx="66" cy="45" r="18" fill="url(#cg)"/><circle cx="66" cy="45" r="13" fill="none" stroke="#92400e" stroke-opacity="0.55" stroke-width="1.5"/><path d="M66 36l7 9-7 9-7-9z" fill="#92400e" fill-opacity="0.75"/></g>
<path d="M46 89H55M77 89H86" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
